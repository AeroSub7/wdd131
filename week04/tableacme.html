<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/tableacme.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pen</title>
    <!-- <script src="./script.js"></script> -->
</head>

<body>
    <table>
        <caption>Table 1:Account Feature Comparison</caption>
        <thead>
            <tr>
                <th colspan="4" scope="colgroup">Acme wildwest Services</th>
            </tr>
            <tr>
                <td></td>
                <th scope="col" class="sub">Basic</th>
                <th scope="col" class="sub">Premium</th>
                <th scope="col" class="sub">Deluxe</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">Feature 1</th>
                <td>✔️</td>
                <td>✔️</td>
                <td>✔️</td>
            </tr>
            <tr>
                <th scope="row">Feature 2</th>
                <td>❌</td>
                <td>✔️</td>
                <td>✔️</td>
            </tr>
            <tr>
                <th scope="row">Feature 3</th>
                <td>❌</td>
                <td>❌</td>
                <td>✔️</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
