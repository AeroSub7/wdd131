<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meridian, Idaho</title>
    <meta name="author" content="Eric Johnson">
    <meta name="description"
        content="Meridian, Idaho about page, where eric Johnson currently lives, with a data and weather sections.">
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">
    <script src="scripts/place.js" defer></script>
</head>

<body>
    <header>
        <h1>Meridian</h1>
    </header>
    <main>
        <picture>
            <!-- srcset="images/meridian-city-large.webp 1500w, images/meridian-city.webp 1000w, images/welcome-to-meridian-id.webp
             480w" sizes="(width > 1000px) 1500px, (width >= 600px) 1000px, (width < 600px) 480px" -->
            <source media="(width > 1000px)" srcset="images/meridian-city-large.webp">
            <source media="(width > 600px)" srcset="images/meridian-city.webp">
            <img src="images/welcome-to-meridian-id.webp" alt="Meridian City" id="hero">
        </picture>

        <section id="data-part">
            <h2>Data</h2>
            <table>
                <tr>
                    <th>Area: </th>
                    <td> 36.39 sq mi (94.25 sq km)</td>
                </tr>
                <tr>
                    <th>Population: </th>
                    <td> 139,700</td>
                </tr>
                <tr>
                    <th>City Hall: </th>
                    <td> 33 E. Broadway Ave.</td>
                </tr>
                <tr>
                    <th>Language: </th>
                    <td> English</td>
                </tr>
                <tr>
                    <th>Currency: </th>
                    <td> American Dollar</td>
                </tr>
                <tr>
                    <th>Time Zone: </th>
                    <td> Mountain Daylight Time (GMT-6)</td>
                </tr>
                <tr>
                    <th>Area Code: </th>
                    <td> 208, 986</td>
                </tr>
            </table>
        </section>
        <section id="weather-part">
            <h2 id="weather">Weather </h2>

            <img src="images/weather.svg" alt="Weather Icon" id="weat-icon">
            <table>
                <tr>
                    <th>Temperature: </th>
                    <td id="temperature"></td>
                </tr>
                <tr>
                    <th>Conditions: </th>
                    <td id="conditions"></td>
                </tr>
                <tr>
                    <th>Wind: </th>
                    <td id="wind"></td>
                </tr>
                <tr>
                    <th>Wind Chill: </th>
                    <td id="wind-chill"></td>
                </tr>
            </table>
        </section>
    </main>
    <footer>
        <p>©<span id="currentyear"></span> 🏭 Eric Johnson 🏭 Idaho, USA</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
